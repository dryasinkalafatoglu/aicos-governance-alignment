name: Reducer Tests v2 Remediation

on:
  push:
    branches:
      - main
    paths:
      - "contracts/REDUCER_PRECEDENCE_v2.json"
      - "fixtures/REDUCER_CASES_v2.json"
      - "tools/run_reducer_cases_v2.py"
      - ".github/workflows/reducer-tests-v2.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reducer-tests-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run reducer remediation tests
        run: python tools/run_reducer_cases_v2.py

      - name: Show generated receipt
        if: always()
        run: cat evidence/REDUCER_EXECUTION_v2.json

      - name: Attest execution receipt
        if: success()
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: evidence/REDUCER_EXECUTION_v2.json

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reducer-execution-receipt-v2
          path: evidence/REDUCER_EXECUTION_v2.json
          if-no-files-found: error
